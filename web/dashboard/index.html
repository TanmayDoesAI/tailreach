<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Devices">
  <meta name="theme-color" content="#000000">
  <title>Devices</title>
  <style>
    :root {
      --bg: #000; --group: #1c1c1e; --fill: rgba(120,120,128,.16); --hairline: rgba(84,84,88,.6);
      --text: #f5f5f7; --text-2: rgba(235,235,245,.6); --text-3: rgba(235,235,245,.3);
      --accent: #0a84ff; --green: #30d158; --amber: #ffd60a;
      color-scheme: dark;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font: 17px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      padding: calc(20px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));
    }
    main { max-width: 600px; margin: 0 auto; }
    h1 { margin: 24px 4px 4px; font-size: 34px; font-weight: 700; letter-spacing: -.02em; }
    .account { margin: 0 4px 24px; font-size: 15px; color: var(--text-2); }

    .list { background: var(--group); border-radius: 14px; overflow: hidden; }
    .row {
      display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 10px 16px;
      color: inherit; text-decoration: none; position: relative;
    }
    .row + .row::before {
      content: ""; position: absolute; top: 0; right: 0; left: 66px; height: .5px; background: var(--hairline);
    }
    a.row:active { background: rgba(255,255,255,.06); }
    .glyph {
      width: 36px; height: 36px; border-radius: 9px; flex: none;
      display: grid; place-items: center; background: var(--fill); color: var(--text);
    }
    .glyph svg { width: 20px; height: 20px; }
    .meta { flex: 1; min-width: 0; }
    .name { font-size: 17px; font-weight: 500; }
    .state { display: flex; align-items: center; gap: 6px; margin-top: 2px; font-size: 13px; color: var(--text-2); }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); flex: none; }
    .on .dot { background: var(--green); }
    .warn .dot { background: var(--amber); }
    .off .name { color: var(--text-2); }
    .chev { color: var(--text-3); width: 14px; height: 14px; flex: none; }
    .empty { padding: 18px 16px; color: var(--text-2); font-size: 15px; }

    .hint { margin: 10px 16px 0; font-size: 13px; line-height: 1.45; color: var(--text-2); }
    code { white-space: nowrap; font: 12.5px ui-monospace, "SF Mono", Menlo, monospace; color: var(--text); }
  </style>
</head>
<body>
<main>
  <h1>Devices</h1>
  <p class="account" id="who">&nbsp;</p>

  <div class="list" id="list"><div class="empty">Looking for devices…</div></div>
  <p class="hint">To add a computer, turn on Screen Sharing on it and run
    <code>mydevices --name <i>name</i></code> signed in to the same Tailscale account.</p>
</main>

<script>
  const ICON = {
    darwin:  '<rect x="3" y="4.5" width="18" height="12" rx="2"/><path d="M1.5 19.5h21"/>',
    windows: '<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 20.5h8"/>',
    linux:   '<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M7.5 9l2.5 2-2.5 2M12.5 13h4M8 20.5h8"/>',
  };
  const svg = (p) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);

  function ago(t) {
    const s = (Date.now() - new Date(t)) / 1000;
    if (s < 90) return 'just now';
    if (s < 3600) return `${Math.round(s / 60)} min ago`;
    if (s < 86400) return `${Math.round(s / 3600)} h ago`;
    return `${Math.round(s / 86400)} d ago`;
  }

  function row(d) {
    let cls = 'off', label = `Offline · ${ago(d.lastSeen)}`;
    if (d.online && d.screen) { cls = 'on'; label = d.local ? 'Online · this Mac' : 'Online'; }
    else if (d.online) { cls = 'warn'; label = 'Screen Sharing is off'; }
    const tag = cls === 'off' ? 'div' : 'a';
    const href = tag === 'a' ? ` href="./${encodeURIComponent(d.name)}/"` : '';
    return `<${tag} class="row ${cls}"${href}>
      <span class="glyph">${svg(ICON[d.os] || ICON.linux)}</span>
      <span class="meta"><div class="name">${esc(d.name)}</div><div class="state"><span class="dot"></span>${label}</div></span>
      ${tag === 'a' ? `<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>` : ''}
    </${tag}>`;
  }

  async function refresh() {
    try {
      const r = await fetch('api/devices', { cache: 'no-store' });
      if (r.status === 401) return location.replace('/login?next=/');
      const data = await r.json();
      document.getElementById('who').textContent = data.owner;
      document.getElementById('list').innerHTML = data.devices.map(row).join('');
    } catch {
      document.getElementById('list').innerHTML = '<div class="empty">Can’t reach the hub.</div>';
    }
  }
  refresh();
  setInterval(refresh, 5000);
</script>
</body>
</html>
