<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="My Devices">
  <meta name="theme-color" content="#0b0d12">
  <title>My Devices</title>
  <style>
    /* Everything for the dashboard lives in this one file — edit freely. */
    :root {
      --bg: #0b0d12; --card: #161921; --line: rgba(255,255,255,.08);
      --text: #e9ecf2; --muted: #8b93a7; --accent: #4f8cff;
      --ok: #34c759; --warn: #ffb020; --off: #5b6170;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      padding: calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    }
    main { max-width: 760px; margin: 0 auto; }
    header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
    h1 { margin: 0; font-size: 28px; letter-spacing: -.02em; }
    .muted { color: var(--muted); font-size: 13px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
    .card {
      display: flex; flex-direction: column; gap: 10px; padding: 16px;
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      color: inherit; text-decoration: none; transition: transform .1s, border-color .1s;
    }
    a.card:hover { border-color: var(--accent); }
    a.card:active { transform: scale(.98); }
    .card.off { opacity: .55; }
    .top { display: flex; align-items: center; gap: 12px; }
    .icon {
      width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center;
      background: rgba(79,140,255,.12); color: var(--accent); flex: none;
    }
    .name { font-size: 17px; font-weight: 600; }
    .status { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--off); }
    .on .dot { background: var(--ok); box-shadow: 0 0 0 3px rgba(52,199,89,.18); }
    .warn .dot { background: var(--warn); }
    .link { font-size: 12px; color: var(--muted); word-break: break-all; }
    .add { margin-top: 28px; padding: 16px; border: 1px dashed var(--line); border-radius: 16px; }
    .add h2 { margin: 0 0 6px; font-size: 15px; }
    code { background: rgba(255,255,255,.06); padding: 2px 6px; border-radius: 6px; font-size: 13px; }
  </style>
</head>
<body>
<main>
  <header>
    <h1>My Devices</h1>
    <span class="muted" id="who"></span>
  </header>
  <div class="grid" id="list"><p class="muted">Looking for devices…</p></div>

  <section class="add">
    <h2>Add another computer</h2>
    <p class="muted">On it, turn on Screen Sharing, then run
      <code>mydevices --name <i>mac2</i></code>
      and sign in with the same Tailscale account. It shows up here within a few seconds.</p>
  </section>
</main>

<script>
  const ICONS = {
    darwin:  '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M2 20h20"/></svg>',
    windows: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 3v18M3 12h18"/></svg>',
    linux:   '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M7 9l3 2-3 2M12 14h4"/></svg>',
  };
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);

  function ago(t) {
    const s = (Date.now() - new Date(t)) / 1000;
    if (s < 90) return 'just now';
    if (s < 3600) return `${Math.round(s / 60)} min ago`;
    if (s < 86400) return `${Math.round(s / 3600)} h ago`;
    return `${Math.round(s / 86400)} d ago`;
  }

  function card(d) {
    let cls = 'off', label = `Offline · seen ${ago(d.lastSeen)}`;
    if (d.online && d.screen) { cls = 'on'; label = d.local ? 'Online · this hub' : 'Online'; }
    else if (d.online) { cls = 'warn'; label = 'Online · Screen Sharing is off'; }
    const tag = cls === 'off' ? 'div' : 'a';
    return `<${tag} class="card ${cls}" ${tag === 'a' ? `href="./${encodeURIComponent(d.name)}/"` : ''}>
      <div class="top">
        <div class="icon">${ICONS[d.os] || ICONS.linux}</div>
        <div><div class="name">${esc(d.name)}</div>
          <div class="status"><span class="dot"></span>${label}</div></div>
      </div>
      <div class="link">${esc(location.host)}/${esc(d.name)}</div>
    </${tag}>`;
  }

  async function refresh() {
    try {
      const r = await fetch('api/devices', { cache: 'no-store' });
      const data = await r.json();
      document.getElementById('who').textContent = data.owner;
      document.getElementById('list').innerHTML = data.devices.map(card).join('');
    } catch {
      document.getElementById('list').innerHTML = '<p class="muted">Can’t reach the hub.</p>';
    }
  }
  refresh();
  setInterval(refresh, 5000);
</script>
</body>
</html>
