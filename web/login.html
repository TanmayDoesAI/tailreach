<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Devices">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>Sign in</title>
  <style>
    :root {
      --bg: #000; --fill: rgba(120,120,128,.16); --text: #f5f5f7; --text-2: rgba(235,235,245,.6);
      --accent: #0a84ff; --red: #ff453a; color-scheme: dark;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center;
      padding: 24px 24px calc(24px + env(safe-area-inset-bottom));
      background: var(--bg); color: var(--text);
      font: 17px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main { width: min(340px, 100%); display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
    .glyph { color: var(--text-2); margin-bottom: 12px; }
    .glyph svg { width: 34px; height: 34px; }
    h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -.02em; }
    #who { margin: 0 0 28px; font-size: 15px; color: var(--text-2); }
    section, form { width: 100%; display: flex; flex-direction: column; gap: 10px; }
    p.note { margin: 0 0 6px; font-size: 15px; color: var(--text-2); }
    input {
      width: 100%; height: 50px; padding: 0 16px; border: 0; border-radius: 12px; outline: none;
      background: var(--fill); color: var(--text); font: inherit; font-size: 17px; text-align: center;
    }
    input#code { letter-spacing: .5em; font-variant-numeric: tabular-nums; }
    input::placeholder { color: rgba(235,235,245,.3); letter-spacing: normal; }
    button {
      width: 100%; height: 50px; border: 0; border-radius: 12px; cursor: pointer;
      background: var(--accent); color: #fff; font: inherit; font-size: 17px; font-weight: 600;
    }
    button:active { opacity: .85; }
    button.quiet { height: 40px; background: none; color: var(--accent); font-weight: 400; font-size: 15px; }
    .err { margin: 8px 0 0; min-height: 20px; font-size: 14px; color: var(--red); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<main>
  <span class="glyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V7.5a3.5 3.5 0 0 1 7 0v3"/></svg></span>
  <h1>Devices</h1>
  <p id="who">&nbsp;</p>

  <!-- Device password: once every 30 days per device -->
  <form id="password" class="hidden">
    <input id="pw" type="password" autocomplete="current-password" placeholder="Password">
    <button type="submit">Continue</button>
    <p class="note" style="margin-top:6px">This device will be remembered for 30 days.</p>
  </form>

  <!-- Returning device -->
  <section id="signin" class="hidden">
    <button id="signinBtn">Continue with passkey</button>
    <button id="pwBtn" class="quiet">Use password instead</button>
    <button id="addBtn" class="quiet">Use a new device</button>
  </section>

  <!-- New device -->
  <section id="pair" class="hidden">
    <p class="note" id="pairHint">Get a one-time code on your Mac to add this device.</p>
    <button id="codeBtn">Send code to Mac</button>
    <input id="code" class="hidden" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="Code">
    <button id="registerBtn" class="hidden">Create passkey</button>
    <button id="backBtn" class="quiet hidden">I already have a passkey</button>
  </section>

  <p class="err" id="err"></p>
</main>

<script>
  const $ = (s) => document.querySelector(s);
  const next = new URLSearchParams(location.search).get('next') || '/';
  const safeNext = next.startsWith('/') && !next.startsWith('//') ? next : '/';

  // base64url <-> ArrayBuffer
  const b64 = {
    dec: (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/').padEnd(Math.ceil(s.length / 4) * 4, '=')), (c) => c.charCodeAt(0)).buffer,
    enc: (b) => btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''),
  };

  function creationOptions(o) {
    if (PublicKeyCredential.parseCreationOptionsFromJSON) return PublicKeyCredential.parseCreationOptionsFromJSON(o);
    return { ...o, challenge: b64.dec(o.challenge), user: { ...o.user, id: b64.dec(o.user.id) },
      excludeCredentials: (o.excludeCredentials || []).map((c) => ({ ...c, id: b64.dec(c.id) })) };
  }
  function requestOptions(o) {
    if (PublicKeyCredential.parseRequestOptionsFromJSON) return PublicKeyCredential.parseRequestOptionsFromJSON(o);
    return { ...o, challenge: b64.dec(o.challenge),
      allowCredentials: (o.allowCredentials || []).map((c) => ({ ...c, id: b64.dec(c.id) })) };
  }
  function credJSON(c) {
    if (c.toJSON) return c.toJSON();
    const r = c.response, out = { id: c.id, rawId: b64.enc(c.rawId), type: c.type, response: { clientDataJSON: b64.enc(r.clientDataJSON) } };
    if (r.attestationObject) out.response.attestationObject = b64.enc(r.attestationObject);
    if (r.authenticatorData) {
      out.response.authenticatorData = b64.enc(r.authenticatorData);
      out.response.signature = b64.enc(r.signature);
      if (r.userHandle) out.response.userHandle = b64.enc(r.userHandle);
    }
    return out;
  }

  async function post(path, body) {
    // Never hang silently: a request that doesn't come back in 15 s is reported.
    const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined, signal: AbortSignal.timeout?.(15000) });
    if (!r.ok) throw new Error((await r.text()).trim() || r.statusText);
    return r.status === 204 ? null : r.json();
  }

  function show(id) {
    for (const s of ['password', 'signin', 'pair']) $('#' + s).classList.toggle('hidden', s !== id);
    $('#err').textContent = '';
  }
  const fail = (e) => {
    $('#err').textContent =
      e.name === 'NotAllowedError' ? 'Passkey cancelled or not available. Try again, or use your password.'
      : e instanceof TypeError || e.name === 'TimeoutError' || e.name === 'AbortError' ? 'Can’t reach your Mac. Check that Tailscale is connected on this device, then try again.'
      : e.message;
  };

  let busy = false;
  async function signIn() {
    if (busy) return;
    busy = true;
    $('#signinBtn').textContent = 'Waiting for passkey…';
    $('#err').textContent = '';
    try {
      const { id, options } = await post('auth/login/begin');
      const cred = await navigator.credentials.get({ publicKey: requestOptions(options.publicKey) });
      await post('auth/login/finish?id=' + id, credJSON(cred));
      location.replace(safeNext);
    } catch (e) { fail(e); }
    finally { busy = false; $('#signinBtn').textContent = 'Continue with passkey'; }
  }

  $('#signinBtn').onclick = signIn;
  $('#pwBtn').onclick = () => { show('password'); $('#pw').focus(); };
  $('#addBtn').onclick = () => { show('pair'); $('#backBtn').classList.remove('hidden'); };
  $('#backBtn').onclick = () => show('signin');

  $('#codeBtn').onclick = async () => {
    try {
      await post('auth/pair');
      $('#pairHint').textContent = 'Enter the code from the notification on your Mac.';
      $('#code').classList.remove('hidden');
      $('#registerBtn').classList.remove('hidden');
      $('#codeBtn').textContent = 'Send new code'; $('#codeBtn').className = 'quiet';
      $('#code').focus();
    } catch (e) { fail(e); }
  };

  $('#registerBtn').onclick = async () => {
    try {
      const { id, options } = await post('auth/register/begin', { code: $('#code').value.trim() });
      const cred = await navigator.credentials.create({ publicKey: creationOptions(options.publicKey) });
      await post('auth/register/finish?id=' + id, credJSON(cred));
      location.replace(safeNext);
    } catch (e) { fail(e); }
  };

  $('#password').onsubmit = async (e) => {
    e.preventDefault();
    try {
      await post('auth/password', { password: $('#pw').value });
      $('#pw').value = '';
      location.replace(safeNext);   // the password signs you in; a passkey is optional
    } catch (err) { fail(err); }
  };

  async function route() {
    const st = await (await fetch('auth/status', { cache: 'no-store' })).json();
    $('#who').textContent = st.owner;
    if (st.authed) return location.replace(safeNext);
    if (st.needPassword) { show('password'); $('#pw').focus(); return; }
    if (!st.codeNeeded) {   // the device password already proved it's you: no code needed
      $('#pairHint').textContent = 'Create a passkey so next time it’s just Face ID.';
      $('#codeBtn').classList.add('hidden');
      $('#registerBtn').classList.remove('hidden');
    }
    if (!window.PublicKeyCredential) { $('#err').textContent = 'This browser doesn’t support passkeys.'; return; }
    show(st.registered ? 'signin' : 'pair');
  }
  route();
</script>
</body>
</html>
