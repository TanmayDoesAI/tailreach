<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="My Devices">
  <meta name="theme-color" content="#0b0d12">
  <title>Sign in · My Devices</title>
  <style>
    :root { --bg:#0b0d12; --card:#161921; --line:rgba(255,255,255,.08); --text:#e9ecf2; --muted:#8b93a7; --accent:#4f8cff; --bad:#ff453a; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px;
      background:var(--bg); color:var(--text); font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; }
    main { width:min(380px,100%); display:flex; flex-direction:column; gap:14px; text-align:center; }
    .lock { width:64px; height:64px; margin:0 auto 4px; border-radius:20px; display:grid; place-items:center;
      background:rgba(79,140,255,.12); color:var(--accent); }
    h1 { margin:0; font-size:24px; letter-spacing:-.02em; }
    p { margin:0; color:var(--muted); }
    button, input { font:inherit; font-size:17px; border-radius:14px; min-height:52px; width:100%; }
    button { border:0; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
    button.ghost { background:none; color:var(--accent); font-weight:500; min-height:40px; }
    input { text-align:center; letter-spacing:.4em; background:var(--card); color:var(--text); border:1px solid var(--line); padding:0 12px; }
    .err { color:var(--bad); min-height:1.4em; }
    .hidden { display:none !important; }
  </style>
</head>
<body>
<main>
  <div class="lock">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
  </div>
  <h1>My Devices</h1>
  <p id="who"></p>

  <!-- Returning device -->
  <section id="signin" class="hidden">
    <button id="signinBtn">Unlock with passkey</button>
    <button id="addBtn" class="ghost">This is a new phone or tablet</button>
  </section>

  <!-- New device: pairing code shown on the Mac -->
  <section id="pair" class="hidden" style="display:flex;flex-direction:column;gap:12px">
    <p id="pairHint">To add this device, get a code shown on your Mac.</p>
    <button id="codeBtn">Show code on my Mac</button>
    <input id="code" class="hidden" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000">
    <button id="registerBtn" class="hidden">Create passkey</button>
    <button id="backBtn" class="ghost hidden">I already have a passkey</button>
  </section>

  <p class="err" id="err"></p>
</main>

<script>
  const $ = (s) => document.querySelector(s);
  const next = new URLSearchParams(location.search).get('next') || '/';
  const safeNext = next.startsWith('/') && !next.startsWith('//') ? next : '/';

  // base64url <-> ArrayBuffer
  const b64 = {
    dec: (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/').padEnd(Math.ceil(s.length / 4) * 4, '=')), (c) => c.charCodeAt(0)).buffer,
    enc: (b) => btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''),
  };

  function creationOptions(o) {
    if (PublicKeyCredential.parseCreationOptionsFromJSON) return PublicKeyCredential.parseCreationOptionsFromJSON(o);
    return { ...o, challenge: b64.dec(o.challenge), user: { ...o.user, id: b64.dec(o.user.id) },
      excludeCredentials: (o.excludeCredentials || []).map((c) => ({ ...c, id: b64.dec(c.id) })) };
  }
  function requestOptions(o) {
    if (PublicKeyCredential.parseRequestOptionsFromJSON) return PublicKeyCredential.parseRequestOptionsFromJSON(o);
    return { ...o, challenge: b64.dec(o.challenge),
      allowCredentials: (o.allowCredentials || []).map((c) => ({ ...c, id: b64.dec(c.id) })) };
  }
  function credJSON(c) {
    if (c.toJSON) return c.toJSON();
    const r = c.response, out = { id: c.id, rawId: b64.enc(c.rawId), type: c.type, response: { clientDataJSON: b64.enc(r.clientDataJSON) } };
    if (r.attestationObject) out.response.attestationObject = b64.enc(r.attestationObject);
    if (r.authenticatorData) {
      out.response.authenticatorData = b64.enc(r.authenticatorData);
      out.response.signature = b64.enc(r.signature);
      if (r.userHandle) out.response.userHandle = b64.enc(r.userHandle);
    }
    return out;
  }

  async function post(path, body) {
    const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
    if (!r.ok) throw new Error((await r.text()).trim() || r.statusText);
    return r.status === 204 ? null : r.json();
  }

  function show(id) {
    for (const s of ['signin', 'pair']) $('#' + s).classList.toggle('hidden', s !== id);
    $('#err').textContent = '';
  }
  const fail = (e) => { $('#err').textContent = e.name === 'NotAllowedError' ? 'Cancelled.' : e.message; };

  async function signIn() {
    try {
      const { id, options } = await post('auth/login/begin');
      const cred = await navigator.credentials.get({ publicKey: requestOptions(options.publicKey) });
      await post('auth/login/finish?id=' + id, credJSON(cred));
      location.replace(safeNext);
    } catch (e) { fail(e); }
  }

  $('#signinBtn').onclick = signIn;
  $('#addBtn').onclick = () => { show('pair'); $('#backBtn').classList.remove('hidden'); };
  $('#backBtn').onclick = () => show('signin');

  $('#codeBtn').onclick = async () => {
    try {
      await post('auth/pair');
      $('#pairHint').textContent = 'Enter the 6-digit code from the notification on your Mac.';
      $('#code').classList.remove('hidden');
      $('#registerBtn').classList.remove('hidden');
      $('#codeBtn').textContent = 'Send a new code';
      $('#code').focus();
    } catch (e) { fail(e); }
  };

  $('#registerBtn').onclick = async () => {
    try {
      const { id, options } = await post('auth/register/begin', { code: $('#code').value.trim() });
      const cred = await navigator.credentials.create({ publicKey: creationOptions(options.publicKey) });
      await post('auth/register/finish?id=' + id, credJSON(cred));
      location.replace(safeNext);
    } catch (e) { fail(e); }
  };

  (async () => {
    if (!window.PublicKeyCredential) { $('#err').textContent = 'This browser doesn’t support passkeys.'; return; }
    const st = await (await fetch('auth/status', { cache: 'no-store' })).json();
    $('#who').textContent = st.owner;
    if (st.authed) return location.replace(safeNext);
    show(st.registered ? 'signin' : 'pair');
  })();
</script>
</body>
</html>
