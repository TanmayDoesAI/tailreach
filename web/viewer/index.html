<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mac">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" href="novnc/app/images/icons/novnc-ios-180.png">
  <link rel="stylesheet" href="app.css">
  <title>Mac Remote</title>
</head>
<body data-state="off" data-mode="trackpad">
  <!-- The remote screen. app.js pans/zooms it with a CSS transform. -->
  <canvas id="screen"></canvas>
  <!-- Catches all touch / mouse input on top of the screen -->
  <div id="surface"></div>

  <div id="splash">
    <div class="spinner"></div>
    <p id="splashText">Connecting…</p>
    <a id="splashAction" class="hidden"></a>
  </div>

  <!-- Status pill: tap to hide / show the toolbar -->
  <button id="status" class="pill"><span class="dot"></span><span id="statusText">Connecting</span></button>

  <nav id="bar">
    <button data-act="keyboard" title="Keyboard">⌨︎</button>
    <button data-act="mode" id="modeBtn" title="Trackpad / touch">◎</button>
    <button data-mod="cmd">⌘</button>
    <button data-mod="opt">⌥</button>
    <button data-mod="ctrl">⌃</button>
    <button data-mod="shift">⇧</button>
    <button data-key="esc">esc</button>
    <button data-act="more" title="More">⋯</button>
  </nav>

  <nav id="keys">
    <button data-key="left">←</button>
    <button data-key="up">↑</button>
    <button data-key="down">↓</button>
    <button data-key="right">→</button>
    <button data-key="tab">⇥</button>
    <button data-combo="cmd+c">⌘C</button>
    <button data-combo="cmd+v">⌘V</button>
    <button data-combo="cmd+z">⌘Z</button>
    <button data-combo="cmd+a">⌘A</button>
    <button data-combo="cmd+tab">⌘⇥</button>
    <button data-combo="cmd+space">⌘␣</button>
  </nav>

  <section id="more" class="sheet hidden">
    <div class="grid">
      <button data-combo="ctrl+up">Mission Control</button>
      <button data-combo="cmd+space">Spotlight</button>
      <button data-combo="cmd+tab">App Switcher</button>
      <button data-key="f11">Show Desktop</button>
      <button data-combo="cmd+opt+esc">Force Quit</button>
      <button data-combo="cmd+shift+3">Screenshot</button>
    </div>
    <div class="grid four">
      <button data-media="prev">⏮</button>
      <button data-media="play">⏯</button>
      <button data-media="next">⏭</button>
      <button data-media="mute">🔇</button>
      <button data-media="voldown">🔉</button>
      <button data-media="volup">🔊</button>
      <button data-media="brdown">🔅</button>
      <button data-media="brup">🔆</button>
    </div>

    <label class="row">Quality
      <select id="quality">
        <option value="saver">Data saver</option>
        <option value="auto">Auto</option>
        <option value="crisp">Crisp</option>
      </select>
    </label>
    <label class="row">Frame rate
      <select id="fps"><option value="30">30</option><option value="60">60</option></select>
    </label>
    <label class="row">Pointer speed <input id="speed" type="range" min="0.5" max="3" step="0.1"></label>
    <label class="row">Natural scrolling <input id="natural" type="checkbox"></label>

    <div class="clip">
      <textarea id="clipText" placeholder="Text to type on the Mac…"></textarea>
      <button data-act="typeText">Type it on the Mac</button>
    </div>

    <div class="grid three">
      <button data-combo="ctrl+cmd+q">Lock Mac</button>
      <a class="btn" href="classic/">Unlock (VNC)</a>
      <a class="btn" href="../">All devices</a>
    </div>
    <button data-act="close" class="primary">Done</button>
  </section>

  <!-- Hidden input that brings up the on-screen keyboard -->
  <textarea id="kbd" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false"></textarea>

  <script src="app.js"></script>
</body>
</html>
