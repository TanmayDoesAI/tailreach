<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mac">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" href="novnc/app/images/icons/novnc-ios-180.png">
  <link rel="stylesheet" href="app.css">
  <title>Mac</title>
</head>
<body data-state="off" data-mode="trackpad">
  <canvas id="screen"></canvas>
  <video id="video" playsinline muted autoplay disablepictureinpicture></video>
  <div id="surface"></div>

  <!-- Connecting / error -->
  <div id="splash">
    <div class="loader"></div>
    <p id="splashText">Connecting</p>
    <a id="splashAction" class="hidden"></a>
  </div>

  <!-- Locked Mac: the password is typed into the real lock screen -->
  <form id="unlock" class="card hidden" autocomplete="on">
    <span class="glyph" data-icon="lock"></span>
    <h1>Locked</h1>
    <p class="sub">Enter the password for <span id="macUser"></span></p>
    <input id="macUserField" name="username" autocomplete="username" class="hidden">
    <input id="macPw" name="password" type="password" autocomplete="current-password" placeholder="Password">
    <button type="submit" class="primary" id="unlockBtn">Unlock</button>
    <p class="error" id="unlockErr"></p>
    <a class="quiet" href="classic/">Show lock screen</a>
  </form>

  <!-- Connection status: tap to hide the controls -->
  <button id="status"><span class="dot"></span><span id="statusText"></span></button>

  <!-- Space arrows: in the side margins when there's room -->
  <button id="spacePrev" class="space" data-combo="ctrl+left" data-icon="chevronLeft" aria-label="Previous Space"></button>
  <button id="spaceNext" class="space" data-combo="ctrl+right" data-icon="chevronRight" aria-label="Next Space"></button>

  <!-- Toolbar -->
  <nav id="bar" class="capsule">
    <button data-act="keyboard" data-icon="keyboard" aria-label="Keyboard"></button>
    <button data-act="mode" id="modeBtn" data-icon="trackpad" aria-label="Trackpad or touch"></button>
    <span class="sep"></span>
    <button data-mod="cmd" class="key">⌘</button>
    <button data-mod="opt" class="key">⌥</button>
    <button data-mod="ctrl" class="key">⌃</button>
    <button data-mod="shift" class="key">⇧</button>
    <span class="sep"></span>
    <button data-key="esc" class="key text">esc</button>
    <button data-act="more" data-icon="more" aria-label="More"></button>
  </nav>

  <!-- Extra keys, shown with the keyboard -->
  <nav id="keys" class="capsule">
    <button data-key="tab" class="key text">tab</button>
    <button data-key="left" data-icon="arrowLeft" aria-label="Left"></button>
    <button data-key="up" data-icon="arrowUp" aria-label="Up"></button>
    <button data-key="down" data-icon="arrowDown" aria-label="Down"></button>
    <button data-key="right" data-icon="arrowRight" aria-label="Right"></button>
    <span class="sep"></span>
    <button data-combo="cmd+c" class="key text">⌘C</button>
    <button data-combo="cmd+v" class="key text">⌘V</button>
    <button data-combo="cmd+z" class="key text">⌘Z</button>
    <button data-combo="cmd+a" class="key text">⌘A</button>
  </nav>

  <!-- More -->
  <div id="backdrop" class="hidden" data-act="close"></div>
  <section id="more" class="hidden" aria-label="More">
    <div class="grabber" data-act="close"></div>

    <div class="actions">
      <button data-combo="ctrl+up" data-icon="mission" data-close>Mission Control</button>
      <button data-combo="cmd+space" data-icon="search" data-close>Spotlight</button>
      <button data-combo="cmd+tab" data-icon="apps" data-close>Switch App</button>
      <button data-key="f11" data-icon="desktop" data-close>Desktop</button>
      <button data-combo="cmd+shift+3" data-icon="camera" data-close>Screenshot</button>
      <button data-combo="cmd+opt+esc" data-icon="xCircle" data-close>Force Quit</button>
      <button data-act="pasteToMac" data-icon="paste">Paste</button>
      <button data-act="copyFromMac" data-icon="copy">Copy</button>
    </div>

    <div class="media">
      <button data-media="prev" data-icon="prev" aria-label="Previous"></button>
      <button data-media="play" data-icon="play" aria-label="Play or pause"></button>
      <button data-media="next" data-icon="next" aria-label="Next"></button>
      <span class="sep"></span>
      <button data-media="voldown" data-icon="volDown" aria-label="Volume down"></button>
      <button data-media="volup" data-icon="volUp" aria-label="Volume up"></button>
      <button data-media="mute" data-icon="mute" aria-label="Mute"></button>
      <span class="sep"></span>
      <button data-media="brdown" data-icon="sunDim" aria-label="Brightness down"></button>
      <button data-media="brup" data-icon="sun" aria-label="Brightness up"></button>
    </div>

    <div class="group">
      <div class="item">
        <span>View</span>
        <div class="seg"><button data-act="fit" data-close>Fit</button><button data-act="fillScreen" data-close>Fill</button></div>
      </div>
      <div class="item">
        <span>Input</span>
        <div class="seg"><button data-set="mode" data-value="trackpad">Trackpad</button><button data-set="mode" data-value="touch">Touch</button></div>
      </div>
      <div class="item">
        <span>Quality</span>
        <div class="seg"><button data-set="quality" data-value="saver">Saver</button><button data-set="quality" data-value="auto">Auto</button><button data-set="quality" data-value="crisp">Crisp</button></div>
      </div>
      <div class="item">
        <span>Frame rate</span>
        <div class="seg"><button data-set="fps" data-value="30">30</button><button data-set="fps" data-value="60">60</button></div>
      </div>
      <label class="item">
        <span>Pointer speed</span>
        <input id="speed" type="range" min="0.5" max="3" step="0.1">
      </label>
      <label class="item">
        <span>Natural scrolling</span>
        <input id="natural" type="checkbox" class="switch">
      </label>
    </div>

    <div class="group">
      <textarea id="clipText" rows="2" placeholder="Type text to send"></textarea>
      <div class="item buttons">
        <button data-act="typeText">Type on Mac</button>
        <button data-act="sendClip">Copy to Mac</button>
      </div>
    </div>

    <div class="group">
      <button class="item link" data-combo="ctrl+cmd+q" data-close>Lock Mac</button>
      <a class="item link" href="../">All devices</a>
    </div>
  </section>

  <div id="toast" class="capsule hidden">
    <span id="toastText"></span>
    <button data-act="toastCopy" class="text">Copy</button>
    <button data-act="toastClose" data-icon="x" aria-label="Dismiss"></button>
  </div>

  <textarea id="kbd" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false"></textarea>

  <script src="app.js"></script>
</body>
</html>
